<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H1111 videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            border-bottom: 1px solid #21262d;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 2rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title::before {
            content: "📁";
            font-size: 1.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #7d8590;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 0.875rem;
        }

        .stat-item {
            color: #7d8590;
        }

        .stat-value {
            color: #f0f6fc;
            font-weight: 600;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .media-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            transition: border-color 0.2s ease;
            cursor: pointer;
        }

        .media-item:hover {
            border-color: #58a6ff;
        }

        .media-preview {
            position: relative;
            height: 200px;
            overflow: hidden;
            background-color: #21262d;
        }

        .media-preview img,
        .media-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-preview video {
            pointer-events: none;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0f6fc;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .play-overlay::after {
            content: '▶';
            margin-left: 2px;
        }

        .media-item:hover .play-overlay {
            background-color: #58a6ff;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .media-info {
            padding: 12px 16px;
        }

        .media-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .media-type {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .media-type.image {
            background-color: #1f6feb;
            color: #ffffff;
        }

        .media-type.video {
            background-color: #238636;
            color: #ffffff;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img,
        .modal-content video {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 6px;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #f0f6fc;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s ease;
            background: none;
            border: none;
            padding: 8px;
        }

        .modal-close:hover {
            color: #58a6ff;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 48px 24px;
            color: #7d8590;
        }

        .loading.active {
            display: block;
        }

        .loader {
            border: 2px solid #21262d;
            border-top: 2px solid #58a6ff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state,
        .error-state {
            text-align: center;
            padding: 48px 24px;
        }

        .empty-state h2,
        .error-state h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .empty-state p,
        .error-state p {
            color: #7d8590;
            font-size: 1rem;
        }

        .error-state h2 {
            color: #f85149;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 12px;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">H1111</h1>
            <p class="subtitle">Collection of sample generated videos</p>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="fileCount">0</span> files
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="imageCount">0</span> images
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="videoCount">0</span> videos
                </div>
            </div>
        </header>

        <div class="loading" id="loading">
            <div class="loader"></div>
            <p>Loading media files...</p>
        </div>

        <div id="galleryContainer">
            <div class="empty-state" id="emptyState" style="display: none;">
                <h2>No media files found</h2>
                <p>Add images and videos to the /media folder to get started</p>
            </div>

            <div class="error-state" id="errorState" style="display: none;">
                <h2>Error loading media files</h2>
                <p>Please check the console for more information</p>
            </div>

            <div class="gallery" id="gallery"></div>
        </div>
    </div>

    <!-- Modal for full-size viewing -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalMedia"></div>
        </div>
    </div>

    <script>
        // Configuration
        const supportedImageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
        const supportedVideoExtensions = ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv'];
        const imageExtensions = supportedImageExtensions;
        const videoExtensions = supportedVideoExtensions;

        // Your specific files (we know these exist)
        const knownFiles = [
            '20250530-145338_2531224314.mp4',
            '20250726-094701_3431680009.mp4',
            '20250729-174812_881785311.mp4',
            '20250730-043821_2002453601.mp4',
            '20250730-051304_3780652590.mp4',
            '20250730-063559_3646159164.mp4',
            '20250730-123254_53829397.mp4',
            '20250802-043101_944731867.mp4',
            '20250803-055949_1337307463.mp4',
            '20250803-115044_1383157637.mp4',
            '20250803-190547_2677941536.mp4',
            '20250803-201252_2677941537.mp4',
            '20250805-083808_364057068.mp4',
            '20250808_103914.mp4',
            '20250808-215905_2112730364.mp4',
            '20250810-030649_1355415135.mp4',
            '20250810-045430_1103271199.mp4',
            '20250810-072403_3989896687.mp4',
            '20250909_150756.mp4',
            '20250910_191217.mp4',
            '20250918_161445.mp4',
            '20250921_165357.mp4',
            '20250922_132657.mp4',
            '20250922_142249.mp4',
            'bf16chef.mp4',
            'casound_1_chr2.mp4',
            'catflipsound.mp4',
            'catsound.mp4',
            'decent.mp4',
            'extended_20250401-021755_seed2936548445_20250331-060111_1541185826_1_chr2.mp4',
            'extension.mp4',
            'frogcat.mp4',
            'gooder.mp4',
            'haha.mp4',
            'i2v-A14B_832480_1_A_realistic_action_horror_video_rated_R_for_viole_20250728_180649.mp4',
            'i2v-A14B_832480_1_An_award-winning_hyper-detailed_masterpiece_photo_20250729_031706.mp4',
            'medi.mp4',
            'meow(1).mp4',
            'meows.mp4',
            'multitalk_1751225823_4346_s2287754327.mp4',
            'multitalk_1751335101_9246_s1580953518.mp4',
            'multitalk_1751849312_7794_s4123291134.mp4',
            'multitalk_1751852291_3524_s3659028972_1.mp4',
            'multitalk_1751862572_3231_s3971554891.mp4',
            'multitalk_1752365759_2692_s3085043624.mp4',
            'multitalk_1752443727_9093_s1858335949_1_chr2_prob4(1).mp4',
            'multitalk_1752443727_9093_s1858335949_1_chr2_prob4.mp4',
            'multitalk_1753694205_9243_s3774603075.mp4',
            'newsamp50.mp4',
            'output3.mp4',
            'outputcat(1).mp4',
            'outputcat.mp4',
            'outputrabbit.mp4',
            'pandern.mp4',
            'single_cat_exp4noteaONE.mp4',
            'slapped.mp4',
            'sliding_looper.mp4',
            'spacecat_3_chr2_prob4.mp4',
            'theif.mp4',
            'tmp_l4pz409.mp4',
            'tmp6fz0lcvc.mp4',
            'tmp6s3bp2yt.mp4',
            'tmp87mrxrya.mp4',
            'tmpa_hc1f6y.mp4',
            'tmpr8ugldgo.mp4',
            'tmpsg8e6m00.mp4',
            'tmpv32svan_.mp4',
            'tmpv9jc4hj2.mp4',
            'tmpwchd4zkd.mp4',
            'tmpwxhpc4wb.mp4',
            'tmpyae4ow1v.mp4',
            'v2v985s.mp4',
            'wtf.mp4',
            'yummmymecha.mp4'
        ];

        // DOM elements
        const loading = document.getElementById('loading');
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const errorState = document.getElementById('errorState');
        const modal = document.getElementById('modal');
        const modalMedia = document.getElementById('modalMedia');
        const fileCount = document.getElementById('fileCount');
        const imageCount = document.getElementById('imageCount');
        const videoCount = document.getElementById('videoCount');

        // Media items array
        let mediaItems = [];

        // Check if a file exists
        async function fileExists(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        // Get file extension
        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        // Determine file type
        function getFileType(filename) {
            const extension = getFileExtension(filename);
            if (imageExtensions.includes(extension)) return 'image';
            if (videoExtensions.includes(extension)) return 'video';
            return null;
        }

        // Load media files from the media folder
        async function loadMediaFiles() {
            loading.classList.add('active');
            mediaItems = [];

            console.log('🔍 Loading media files...');

            // Check known files
            console.log('📁 Checking known files in media folder...');
            
            for (const filename of knownFiles) {
                const url = `./media/${filename}`;
                console.log(`🔍 Checking: ${url}`);
                
                try {
                    const exists = await fileExists(url);
                    if (exists) {
                        const type = getFileType(filename);
                        if (type) {
                            console.log(`✅ Loaded: ${filename}`);
                            const mediaItem = {
                                id: Date.now() + Math.random(),
                                url: url,
                                name: filename,
                                type: type
                            };
                            mediaItems.push(mediaItem);
                        }
                    } else {
                        console.log(`❌ Not found: ${filename}`);
                    }
                } catch (error) {
                    console.log(`❌ Error loading ${filename}:`, error);
                }
            }

            loading.classList.remove('active');
            console.log(`📊 Total media files loaded: ${mediaItems.length}`);
            updateGallery();
        }

        // Update gallery display
        function updateGallery() {
            if (mediaItems.length === 0) {
                emptyState.style.display = 'block';
                errorState.style.display = 'none';
                gallery.style.display = 'none';
                updateStats(0, 0, 0);
                return;
            }

            emptyState.style.display = 'none';
            errorState.style.display = 'none';
            gallery.style.display = 'grid';
            
            const images = mediaItems.filter(item => item.type === 'image').length;
            const videos = mediaItems.filter(item => item.type === 'video').length;
            updateStats(mediaItems.length, images, videos);
            
            gallery.innerHTML = mediaItems.map(item => `
                <div class="media-item" onclick="openModal('${item.id}')">
                    <div class="media-preview">
                        ${item.type === 'video' 
                            ? `<video src="${item.url}" muted></video>
                               <div class="play-overlay"></div>`
                            : `<img src="${item.url}" alt="${item.name}">`
                        }
                    </div>
                    <div class="media-info">
                        <div class="media-name">${item.name}</div>
                        <span class="media-type ${item.type}">${item.type}</span>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats(total, images, videos) {
            fileCount.textContent = total;
            imageCount.textContent = images;
            videoCount.textContent = videos;
        }

        // Open modal
        function openModal(id) {
            const item = mediaItems.find(m => m.id == id);
            if (!item) return;

            if (item.type === 'video') {
                modalMedia.innerHTML = `<video src="${item.url}" controls autoplay></video>`;
            } else {
                modalMedia.innerHTML = `<img src="${item.url}" alt="${item.name}">`;
            }

            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            modal.classList.remove('active');
            modalMedia.innerHTML = '';
        }

        // Close modal on background click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Initialize - load media files on page load
        document.addEventListener('DOMContentLoaded', loadMediaFiles);

        console.log(`
        === MEDIA GALLERY SETUP ===
        
        This page automatically loads all images and videos from the /media folder.
        
        Supported formats:
        • Images: JPG, JPEG, PNG, GIF, WebP, BMP, SVG
        • Videos: MP4, WebM, OGG, MOV, AVI, MKV
        
        Current known files: ${knownFiles.join(', ')}
        
        The page will:
        1. Try to get a complete directory listing (if server supports it)
        2. Fall back to loading known files
        3. Display all found media files in the gallery
        
        Add any new media files to the /media folder and refresh the page.
        `);
    </script>
</body>
</html>
